[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "roboforge"
version = "0.8.0"
description = "Reproducible robotics experimentation: validated mathematical foundations"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["numpy>=1.26,<3", "pydantic>=2,<3", "PyYAML>=6,<7"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]
plot = ["matplotlib>=3.8,<4"]

[project.scripts]
roboforge = "roboforge.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
roboforge = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["build", "dist"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"examples/**/*.py" = ["E402"]
