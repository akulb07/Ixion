schema_version: 1
name: full_loop_swept_collision
seed: 42
robot:
  wheel_radius: 0.05
  wheel_separation: 0.30
  footprint_radius: 0.20
  initial_pose: {x: 5.0, y: 5.0, theta: 0.0}
environment:
  name: circular_path_room
  width: 10.0
  height: 10.0
  obstacles:
    - {type: circle, x: 6.0, y: 6.0, radius: 0.10}
simulation:
  dt: 6.283185307179586 # One full loop at omega=1 rad/s.
  integrator: exact
  collision: {mode: stop, spatial_tolerance: 0.000001}
commands:
  - {left: 17.0, right: 23.0, steps: 1} # v=1 m/s, omega=1 rad/s.
