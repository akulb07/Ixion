# Assumed shaft inertia and ideal echo delay; distances are a test fixture.
inertia_kg_m2: 0.01
sensor:
  response_delay_s: 0.0002
duration_s: 1
step_s: 0.001
poll_every_steps: 61
brake_threshold_m: 0.2
timeout_action: brake
targets:
  - time_s: 0
    distance_m: 0.5
  - time_s: 0.2
    distance_m: 0.1
