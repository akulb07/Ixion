# Same rover and sonar controller; each case declares a different lane grade.
schema_version: 1
name: reference_grade_checks
cases:
  - name: level
    controller: sonar
    scenario:
      grade_rad: 0
      wall_distance_m: 1
      front_offset_m: 0.1
      sensor_offset_m: 0.08
      rotating_inertia_per_wheel_kg_m2: 0.002
      friction_coefficient: 0.8
      driven_weight_fraction: 0.8
      sensor:
